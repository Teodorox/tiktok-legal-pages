<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Autorizacao TikTok - codigo</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 60px auto; padding: 0 20px; line-height: 1.6; color: #222; }
  code { background: #f2f2f2; padding: 10px; display: block; word-break: break-all; border-radius: 6px; margin-top: 10px; }
</style>
</head>
<body>
<h1>Autorizacao concluida</h1>
<p>Copie o codigo abaixo e cole no script:</p>
<code id="code">(lendo...)</code>
<script>
  const params = new URLSearchParams(window.location.search);
  document.getElementById("code").textContent = params.get("code") || "Nenhum codigo encontrado na URL.";
</script>
</body>
</html>
